trigger:
  branches:
    include:
      - master
      - "*"

stages:
  - stage: Build
    displayName: "Build and Test"
    jobs:
      - job: Build
        displayName: "Restore, Build, and Test"
        pool:
          name: "Azure Pipelines" # Hosted agent for master
        condition: eq(variables['Build.SourceBranchName'], 'master')

        steps:
          - task: UseDotNet@2
            displayName: "Install .NET SDK"
            inputs:
              packageType: "sdk"
              version: "8.x"

          - script: dotnet restore "Local Azure Devops Agent.sln"
            displayName: "Restore dependencies"

          - script: dotnet build "Local Azure Devops Agent.sln" --no-restore --configuration Release
            displayName: "Build"

      - job: Build_Local
        displayName: "Restore, Build, and Test (Local Agent)"
        pool:
          name: "Local Azure Agent"
        condition: ne(variables['Build.SourceBranchName'], 'master')

        steps:
          - task: UseDotNet@2
            displayName: "Install .NET SDK"
            inputs:
              packageType: "sdk"
              version: "8.x"

          - script: dotnet restore "Local Azure Devops Agent.sln"
            displayName: "Restore dependencies"

          - script: dotnet build "Local Azure Devops Agent.sln" --no-restore --configuration Release
            displayName: "Build"

  - stage: PlantUMLDiagramGeneration
    displayName: "Generate PlantUML Diagram"
    jobs:
      - job: GenerateDiagram
        displayName: "Run PlantUML Docker to generate image"
        pool:
          name: "Local Azure Agent"
        condition: ne(variables['Build.SourceBranchName'], 'master')

        steps:
          # Download the repository
          - download: current

          # Run the Bash script to generate the PNG
          - task: Bash@3
            displayName: "Generate PNG from PlantUML"
            inputs:
              targetType: "filePath"
              filePath: docker-scripts/devops/generate_plantuml.sh

          # Publish the generated PNG as an artifact
          - publish: $(Build.SourcesDirectory)/attachments/umbraco-models.png
            artifact: plantuml-image

  - stage: PlantUMLDiagramDeployment
    displayName: "Upload to Azure DevOps Wiki"
    jobs:
      - job: UploadToWiki
        displayName: "Commit and push image to Azure DevOps Wiki"
        pool:
          name: "Local Azure Agent"
        condition: ne(variables['Build.SourceBranchName'], 'master')

        steps:
          # Checkout the Wiki repo
          - checkout: self

          # Download the artifact containing the image
          - download: current
            artifact: plantuml-image

          # Run the bash script to push the image to the Wiki repo
          - task: Bash@3
            displayName: "Push Image to Wiki Repo"
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              WIKI_REPO_URL: https://dev.azure.com/32302916/Local%20Azure%20Devops%20Agent/_git/Local-Azure-Devops-Agent.wiki
            inputs:
              targetType: "filePath"
              filePath: docker-scripts/devops/push_to_wiki.sh

          # Display the markdown for the image in the Wiki
          - task: Bash@3
            displayName: "Display Wiki Image Markdown"
            inputs:
              targetType: "inline"
              script: |
                echo "Markdown for Wiki: ![Diagram](attachments/diagram.png)"
